<!--
  Dari 위젯 embed smoke 호스트 — Task A-3.

  목적: `dari-theta.vercel.app` 배포 전 cross-origin embed 시나리오를 로컬에서 재현.
    - host 서버(localhost:4001) 가 이 파일을 서빙
    - 위젯 스크립트는 localhost:4000 (Next.js dev 서버) 에서 로드
    - origin 이 다르므로 실제 고객사 embed 와 동일한 CORS/Origin 검증 경로

  bot slug 는 Playwright 가 `?bot=<slug>` 쿼리로 주입해 runtime 에 치환한다.
  (스크립트 태그를 JavaScript 로 동적 생성 → 테스트마다 다른 봇 사용 가능)
-->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dari Widget Embed Host</title>
    <style>
      /* 위젯 격리 검증용 — 호스트 스타일이 위젯 내부에 번지지 않는지 확인하기 위한
         공격적 글로벌 규칙. Shadow DOM 격리가 제대로 작동하면 위젯 내부는 영향 없음. */
      * {
        font-family: "Comic Sans MS", cursive !important;
        color: hotpink !important;
      }
      button {
        border: 5px dashed red !important;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f5f5f5;
      }
      .host-content {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 24px;
      }
      .host-button {
        /* host 사이트가 자체 버튼을 가진 경우 시각적 비교용 */
        padding: 12px 24px;
        background: #333;
      }
    </style>
  </head>
  <body>
    <main class="host-content" data-testid="host-content">
      <h1 data-testid="host-heading">
        Dari Widget Embed Host (Playwright smoke)
      </h1>
      <p data-testid="host-description">
        이 페이지는 위젯 격리 검증용입니다. 위젯 내부 UI 는 위 글로벌 CSS (Comic
        Sans, hotpink) 의 영향을 받으면 안 됩니다 (Shadow DOM closed).
      </p>
      <button class="host-button" data-testid="host-button">Host Button</button>
    </main>

    <!-- external loader — CSP 매트릭스에서 inline 차단과 외부 스크립트 차단 분리 (loader.js 주석 참조). -->
    <script src="loader.js"></script>
  </body>
</html>
