name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck · Lint · Format · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 은 `package.json` 의 `packageManager` 필드 기반으로 setup-pnpm action 이
      # 정확한 버전을 자동 선택 (corepack 패턴). store cache 까지 함께 복원.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Build 는 모듈 로드 시점에 env.server.ts 의 parseServerEnv() 를 실행한다.
      # CI 에서는 실제 Supabase/AI provider 에 연결하지 않으므로,
      # 각 실행마다 무작위 placeholder 를 동적으로 생성해 Zod 제약만 통과시킨다.
      # 실제 secret 이 YAML 에 하드코딩되지 않아 gitleaks 오탐을 원천 차단한다.
      - name: Generate CI placeholder env for build
        run: |
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:4000"
            echo "NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co"
            echo "DATABASE_URL=postgres://ci:ci@localhost:5432/ci_dummy"
            echo "UPSTASH_REDIS_REST_URL=https://ci-placeholder.upstash.io"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(openssl rand -hex 24)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(openssl rand -hex 24)"
            echo "GOOGLE_GENERATIVE_AI_API_KEY=$(openssl rand -hex 24)"
            echo "UPSTASH_REDIS_REST_TOKEN=$(openssl rand -hex 24)"
            echo "ANTHROPIC_API_KEY=sk-$(openssl rand -hex 24)"
            echo "FIRECRAWL_API_KEY=fc-$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build
        env:
          # Sentry source map 업로드를 의도적으로 스킵 (CI 는 실 프로젝트에 업로드 안 함).
          # SENTRY_AUTH_TOKEN/ORG/PROJECT 가 없으면 withSentryConfig 가 안전하게 skip.
          NEXT_TELEMETRY_DISABLED: "1"

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # gitleaks-action@v2 는 개인(personal) 리포지토리에서 무료.
    # 조직(organization) 으로 이전 시 GITLEAKS_LICENSE secret 등록 필요.
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Task B-6: Playwright E2E on CI (chromium, 로컬 Supabase Docker).
  #
  # 전략:
  #   - 외부 프로젝트 추가 비용 0 — `supabase start` 로 runner 내부 스택 기동
  #   - 외부 API (Anthropic/Gemini/Firecrawl) placeholder — rate limit 은
  #     `checkRatelimit` 이 `NODE_ENV !== "production"` 에서 자동 통과 (fail-open)
  #   - Gemini embedding 의존 spec (bot-knowledge-sources/file) 은 상단 `test.skip`
  #     으로 스스로 skip → `E2E_SKIP_EXTERNAL_API=true` 환경변수 매칭
  #   - artifact (trace/video/screenshot) 는 실패 시에만 + 1일 보존
  #     (sec L-2: 로컬 Supabase 의 service_role 은 fixture 키라 노출돼도 실 피해 0)
  e2e:
    name: Playwright E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` 는 첫 실행 시 supabase/migrations/*.sql 을 순차 적용한다.
      # Docker 이미지 pull + init 에 90~120s 소요. CI timeout 20분 내 충분.
      - name: Start local Supabase stack
        run: supabase start

      # 로컬 스택의 실 키(anon/service_role/api_url)를 `-o env` 포맷으로 가져와
      # `.env.local` 생성. `-o json` 은 CLI 버전마다 필드명 (PascalCase vs snake_case)
      # 이 달라질 수 있어 `-o env` 의 안정적 `KEY=VALUE` 포맷 사용 (내부 바이너리에
      # `default=API_URL`/`ANON_KEY`/`SERVICE_ROLE_KEY`/`DB_URL` 로 명시됨).
      # 외부 API 는 placeholder — Zod env 검증만 통과시킨다.
      # `E2E_SKIP_EXTERNAL_API=true` 로 외부 API 의존 spec 은 파일 전체 skip 처리.
      - name: Generate .env.local with local Supabase + placeholders
        run: |
          set -euo pipefail
          STATUS_ENV=$(supabase status -o env)
          API_URL=$(echo "$STATUS_ENV" | grep '^API_URL=' | cut -d= -f2-)
          ANON_KEY=$(echo "$STATUS_ENV" | grep '^ANON_KEY=' | cut -d= -f2-)
          SERVICE_ROLE=$(echo "$STATUS_ENV" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2-)
          DB_URL=$(echo "$STATUS_ENV" | grep '^DB_URL=' | cut -d= -f2-)
          # `-o env` 가 값을 `"..."` 로 감쌀 수 있으므로 양끝 따옴표 제거.
          API_URL=${API_URL%\"}; API_URL=${API_URL#\"}
          ANON_KEY=${ANON_KEY%\"}; ANON_KEY=${ANON_KEY#\"}
          SERVICE_ROLE=${SERVICE_ROLE%\"}; SERVICE_ROLE=${SERVICE_ROLE#\"}
          DB_URL=${DB_URL%\"}; DB_URL=${DB_URL#\"}
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE" ] || [ -z "$DB_URL" ]; then
            echo "::error::supabase status -o env 파싱 실패 — CLI 출력 포맷 확인 필요"
            supabase status -o env
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:4000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE"
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_WIDGET_CDN_URL=http://localhost:4000/widget.js"
            echo "UPSTASH_REDIS_REST_URL=https://ci-placeholder.upstash.io"
            echo "UPSTASH_REDIS_REST_TOKEN=$(openssl rand -hex 24)"
            echo "GOOGLE_GENERATIVE_AI_API_KEY=$(openssl rand -hex 24)"
            echo "ANTHROPIC_API_KEY=sk-$(openssl rand -hex 24)"
            echo "FIRECRAWL_API_KEY=fc-$(openssl rand -hex 24)"
          } > .env.local

      - name: Install Playwright Chromium
        run: pnpm playwright install --with-deps chromium

      - name: Run Playwright E2E (chromium, external API specs skipped)
        run: pnpm test:e2e --project=chromium
        env:
          CI: "true"
          E2E_SKIP_EXTERNAL_API: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      # artifact 보존 1일 — private repo + 로컬 Supabase fixture 키만 포함되므로
      # 노출 위험 최소. redact 자동화는 Backlog (sec L-2 후속).
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 1
          if-no-files-found: ignore
